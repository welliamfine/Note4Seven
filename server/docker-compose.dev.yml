services:
  mysql:
    image: mysql:5.7
    container_name: note-my-life-mysql-dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: local-dev-password
      MYSQL_DATABASE: record_life
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    ports:
      - "3307:3306"
    volumes:
      - note_my_life_mysql_dev:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-plocal-dev-password"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 15s

volumes:
  note_my_life_mysql_dev:
